<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Explore the original 151 Pokémon, save favourites and inspect their stats."
    />
    <title>Pokédex · Kanto collection</title>
    <link rel="icon" href="img/favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to Pokémon</a>
    <div class="shell">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">●</span> Pokédex
      </header>
      <main id="main">
        <section class="intro">
          <h1>Pokédex.</h1>
          <p>Browse the original 151 Pokémon and save your favourites.</p>
        </section>
        <div class="toolbar">
          <label class="grow"
            >Search Pokémon<input
              id="poke-search"
              type="search"
              placeholder="Name or number, e.g. Pikachu or 25" /></label
          ><label
            >Sort by<select id="sort">
              <option value="number">Pokédex number</option>
              <option value="name">Name A–Z</option>
            </select></label
          >
        </div>
        <div class="summary">
          <div class="tabs">
            <button id="all" aria-pressed="true">All Pokémon</button
            ><button id="favorites" aria-pressed="false">Favourites</button>
          </div>
          <span id="count" class="muted"></span>
        </div>
        <p id="status" class="status" role="status">Loading Pokémon…</p>
        <button id="retry" hidden>Try again</button>
        <ul id="pokemonList" class="pokemon-grid"></ul>
      </main>
      <footer>
        Pokémon data: <a href="https://pokeapi.co/">PokéAPI</a>. Favourites are
        saved in this browser. Unofficial fan project.
      </footer>
    </div>
    <dialog id="poke-modal" aria-labelledby="detail-title">
      <button id="close" class="close">Close</button>
      <h2 id="detail-title">Pokémon details</h2>
      <div id="details"></div>
    </dialog>
  </body>
</html>
